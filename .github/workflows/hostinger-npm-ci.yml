name: Hostinger Business - Node + npm

on:
  push:
    branches:
      - migracao-node-mysql-20261110
    paths:
      - "package.json"
      - "src/**"
      - "vite.config.ts"
      - "backend-node/**"
      - ".github/workflows/hostinger-npm-ci.yml"
  pull_request:
    paths:
      - "package.json"
      - "src/**"
      - "vite.config.ts"
      - "backend-node/**"
      - ".github/workflows/hostinger-npm-ci.yml"
permissions:
  contents: read

jobs:
  web-build-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar frontend com npm (sem Bun)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compilar SSR TanStack Start/Nitro
        run: npm run build
      - name: Confirmar entrada Node
        run: test -s .output/server/index.mjs
