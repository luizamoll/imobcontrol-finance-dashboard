name: Frontend CI (Node 22 + npm)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'hosting/**'
      - 'vite.config.ts'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - feat/hostinger-app-unificado-20261111
    paths:
      - 'src/**'
      - 'package.json'
      - 'hosting/**'
      - 'vite.config.ts'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias com npm (padrao Hostinger)
        run: npm install --no-audit --no-fund
      - name: Compilar React SSR + Nitro
        run: npm run build
      - name: Verificar middleware gerado
        run: test -s .output/server/index.mjs
