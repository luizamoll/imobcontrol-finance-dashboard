name: Frontend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "Dockerfile"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "Dockerfile"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
