name: ImobControl Node.js (migracao)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - migracao-node-mysql-20261110
      - migracao-node-mysql-hostinger-20261111
    paths:
      - 'backend-node/**'
      - '.github/workflows/migracao-node-mysql.yml'
  pull_request:
    paths:
      - 'backend-node/**'
      - '.github/workflows/migracao-node-mysql.yml'
permissions:
  contents: read
jobs:
  teste-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe
        run: npm run check
      - name: Testes unitarios
        run: npm test

  integracao-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: imob-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot -pimob-ci-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Teste de integracao API + MySQL
        run: node --test test/integration.mysql.test.js
        env:
          TEST_MYSQL_INTEGRATION: '1'
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: imob-ci-password
