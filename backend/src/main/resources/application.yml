spring:
  application:
    name: imobcontrol-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/imobcontrol;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS:true}

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

imobcontrol:
  bootstrap-admin:
    name: ${IMOB_ADMIN_NAME:}
    email: ${IMOB_ADMIN_EMAIL:}
    password: ${IMOB_ADMIN_PASSWORD:}
  app-url: ${IMOB_APP_URL:http://localhost:3000}
  mail-from: ${IMOB_MAIL_FROM:no-reply@imobcontrol.local}

info:
  app:
    name: ImobControl API
    description: Back-end Java do sistema ImobControl
